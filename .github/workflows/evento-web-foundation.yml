name: EVENTO Web Foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install or verify dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Revenue Engine contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Freeze dependency lockfile on the owner recovery branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'evento/revenue-engine-recovery-v1'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Committed lockfile is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(evento): refresh verified dependency lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Require committed lockfile
        run: git ls-files --error-unmatch package-lock.json
