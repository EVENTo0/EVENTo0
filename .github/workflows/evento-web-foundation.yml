name: EVENTO Web Foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install pinned runtime dependencies for recovery build
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Capture generated recovery lockfile
        uses: actions/upload-artifact@v4
        with:
          name: evento-recovery-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Report reproducibility gate
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Committed lockfile present.'
          else
            echo 'NOTICE: generated package-lock.json is attached as a workflow artifact and must be reviewed/committed before this Draft PR is marked Ready.'
          fi
