name: EVENTO Web Foundation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install pinned runtime dependencies for recovery build
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Require lockfile before recovery PR leaves Draft
        run: |
          test -f package-lock.json || {
            echo 'package-lock.json must be generated, reviewed and committed before this PR is ready to merge.'
            exit 1
          }
