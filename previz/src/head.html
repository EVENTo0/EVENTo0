<title>The Root Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#070605; --panel:#0e0c0a; --line:#221d17; --ink:#e8dfcc; --mute:#8a7f6c; --dim:#4a4236;
    --gold:#c9a84c; --ok:#6fb26f; --bad:#d05a4a; --warn:#e0a030;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --ar:'Noto Naskh Arabic','Amiri','Geeza Pro','Segoe UI',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);padding-inline:16px;padding-block:18px 40px}
  .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .eyebrow{font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
  h1{margin:4px 0 0;font:600 26px/1.2 var(--ar);letter-spacing:0}
  h1 small{font:400 12px var(--mono);color:var(--mute);letter-spacing:.12em;margin-inline-start:10px}
  .note{max-width:560px;color:var(--mute);font-size:11.5px;line-height:1.7}
  .note b{color:var(--ink);font-weight:500}

  .screen{position:relative;aspect-ratio:21/9;width:100%;background:#000;overflow:hidden;border:1px solid var(--line)}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;left:14px;top:12px;font-size:10px;letter-spacing:.2em;color:#e8dfccb0;text-shadow:0 1px 6px #000;pointer-events:none}
  .hud b{color:var(--gold);font-weight:500}
  .rec{position:absolute;right:14px;top:12px;font-size:10px;letter-spacing:.2em;color:#e8dfcc90;text-shadow:0 1px 6px #000;pointer-events:none}
  .rec i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-inline-end:6px;vertical-align:middle}
  .caption{position:absolute;left:0;right:0;bottom:0;padding:26px 6% 16px;text-align:center;font:600 clamp(13px,2.1vw,22px)/1.7 var(--ar);color:#f3ead6;text-shadow:0 2px 10px #000,0 0 3px #000;background:linear-gradient(transparent,#000a);pointer-events:none;transition:opacity .4s;direction:rtl}
  .bigplay{position:absolute;inset:0;margin:auto;width:78px;height:78px;border-radius:50%;border:1px solid #e8dfcc70;background:#000a;color:var(--ink);font-size:26px;cursor:pointer}
  .bigplay:hover{border-color:var(--gold);color:var(--gold)}

  .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:10px}
  button.b{font:500 11px var(--mono);letter-spacing:.14em;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 14px;cursor:pointer;text-transform:uppercase}
  button.b:hover{border-color:var(--gold)}
  button.b[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  button.b:focus-visible,.seg:focus-visible,.thumb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .time{margin-inline-start:auto;color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
  .tl{display:flex;gap:2px;margin-top:10px;height:22px}
  .seg{position:relative;background:#171310;border:0;padding:0;cursor:pointer;overflow:hidden;min-width:0}
  .seg .fill{position:absolute;inset:0;width:0;background:currentColor;opacity:.75}
  .seg .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.1em;color:#fff;mix-blend-mode:difference}
  .seg.on{outline:1px solid var(--ink)}

  h2{font:500 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  .strip{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
  .thumb{position:relative;background:#000;border:1px solid var(--line);padding:0;cursor:pointer;aspect-ratio:21/9;overflow:hidden}
  .thumb canvas{width:100%;height:100%;display:block}
  .thumb span{position:absolute;left:5px;top:3px;font-size:9px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 4px #000}
  .thumb em{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:10px}
  .thumb.on{border-color:var(--gold)}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px}
  .card{min-width:0;background:var(--panel);border:1px solid var(--line);padding:16px}
  .ar{font-family:var(--ar);direction:rtl;text-align:right}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
  .kv{grid-template-columns:auto minmax(0,1fr)} .kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);padding:1px 8px;font-size:11px;color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--mute);font-weight:400;letter-spacing:.12em;font-size:10px}
  td.p{color:var(--ok)} td.f{color:var(--bad)}
  .scroll{overflow-x:auto}
  .sum{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
  .sum div{font-size:11px;color:var(--mute)} .sum b{display:block;font:500 20px var(--mono);color:var(--ink)}
  .sum b.ok{color:var(--ok)} .sum b.bad{color:var(--bad)}
  @media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(5,1fr)}.time{margin-inline-start:0;width:100%}}

  .eps{display:flex;gap:6px;flex-wrap:wrap}
  .eps .b{padding:7px 12px;font-size:11px;letter-spacing:.04em;text-transform:none;font-family:var(--ar)}
  .eps .b span{font:500 10px var(--mono);letter-spacing:.14em;color:var(--gold);margin-inline-end:6px}
  .shotbox{border:1px solid var(--line);padding:10px 12px;margin-bottom:10px}
  .shothead{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--mute);margin-bottom:6px}
  .shothead b{color:var(--gold);font-weight:500}
  .pr{margin-top:8px}
  .prh{display:flex;justify-content:space-between;align-items:center}
  .prh i{font-style:normal;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  .cp{font:500 9px var(--mono);letter-spacing:.14em;color:var(--mute);background:transparent;border:1px solid var(--line);padding:2px 8px;cursor:pointer}
  .cp:hover{color:var(--gold);border-color:var(--gold)}
  .prt{font-size:11.5px;line-height:1.7;color:#cfc6b2;overflow-wrap:anywhere;user-select:text}
  #prompts{max-height:640px;overflow:auto}
</style>
